[project]
name = "concilia-fiscal"
version = "0.1.0"
description = "Validação e conciliação de planilhas contábeis e fiscais."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.17.0",
    "polars>=1.0.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "openpyxl>=3.1.5",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concilia_fiscal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["agent-skills"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "streamlit_app.py"]
